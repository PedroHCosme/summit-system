<div class="section">
    <h2>Como classificamos os membros</h2>
    <p>{{ legenda.intro }}</p>
    <table>
        {% for linha in legenda.linhas %}
        <tr>
            <td style="white-space: nowrap;"><strong>{{ linha.nome }}</strong></td>
            <td>{{ linha.regra }}</td>
        </tr>
        {% endfor %}
    </table>
    <p class="legenda" style="color: var(--text-muted); font-size: 0.85em;">Membros arquivados (fora destas contagens): {{ arquivados }}</p>
</div>
