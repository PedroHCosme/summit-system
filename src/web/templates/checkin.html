{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center;">Check-in</h2>

    <form method="POST" action="{{ url_for('checkin') }}">
        <div class="form-group">
            <label for="identifier">Nome ou Apelido</label>
            <input type="text" id="identifier" name="identifier" class="hero-input" required
                placeholder="Digite seu nome..." value="{{ identifier or '' }}" autocomplete="off" autofocus>
        </div>

        <button type="submit" class="btn btn-primary">CONFIRMAR</button>
    </form>

    {% if results %}
    <div class="alert alert-warning" style="margin-top: 20px; text-align: left;">
        <p style="margin-bottom: 12px; font-weight: 600;">Encontramos varios membros:</p>
        <ul class="member-list">
            {% for member in results %}
            <li>
                <div class="member-info">
                    <span class="member-name">{{ member.nome }}</span>
                    {% if member.apelido %}
                    <span class="member-nickname">{{ member.apelido }}</span>
                    {% endif %}
                </div>
                <form method="POST" action="{{ url_for('checkin') }}" style="margin: 0;"
                    onsubmit="return confirmCheckin('{{ member.nome }}')">
                    <input type="hidden" name="member_id" value="{{ member.id }}">
                    <button type="submit" class="btn btn-success btn-sm">Confirmar</button>
                </form>
            </li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}

    <a href="{{ url_for('index') }}" class="back-link">Voltar</a>
</div>

<!-- Success Feedback Modal -->
<div id="successFeedback" class="feedback-success">
    <div class="checkmark"></div>
    <p>Check-in Realizado!</p>
</div>

<script>
    function confirmCheckin(name) {
        return confirm(`Tem certeza que deseja fazer check-in para ${name}?`);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('identifier');
        if (input) {
            // Focus and select all text on load
            input.focus();
            input.select();
        }

        // Check for success/warning flash messages and show feedback
        const successAlert = document.querySelector('.alert-success');
        const warningAlert = document.querySelector('.alert-warning:not([style*="margin-top"])');

        if (successAlert) {
            // Show success animation
            const feedback = document.getElementById('successFeedback');
            if (feedback) {
                feedback.classList.add('show');
                setTimeout(() => {
                    feedback.classList.remove('show');
                }, 2500);
            }
        }
    });
</script>
{% endblock %}
