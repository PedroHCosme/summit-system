{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 20px;">Novo Cadastro</h2>

    <form method="POST" action="{{ url_for('register') }}">
        <div class="form-group">
            <label for="nome">Nome Completo *</label>
            <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
        </div>

        <div class="form-group">
            <label for="apelido">Apelido (Opcional)</label>
            <input type="text" id="apelido" name="apelido" placeholder="Como gosta de ser chamado">
        </div>

        <div class="form-group">
            <label for="plano">Plano *</label>
            <select id="plano" name="plano" required>
                <option value="" disabled selected>Selecione um plano</option>
                {% for plano in planos %}
                <option value="{{ plano }}">{{ plano }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="whatsapp">WhatsApp</label>
            <input type="text" id="whatsapp" name="whatsapp" placeholder="(XX) XXXXX-XXXX">
        </div>

        <div class="form-group">
            <label for="data_nascimento">Data de Nascimento</label>
            <input type="text" id="data_nascimento" name="data_nascimento" placeholder="dd/mm/aaaa">
        </div>

        <div class="form-group">
            <label for="genero">Gênero</label>
            <select id="genero" name="genero">
                <option value="" disabled selected>Selecione...</option>
                <option value="Masculino">Masculino</option>
                <option value="Feminino">Feminino</option>
                <option value="Outro">Outro</option>
            </select>
        </div>

        <div class="form-group">
            <label for="calcado">Tamanho do Calçado</label>
            <input type="number" id="calcado" name="calcado" placeholder="Ex: 40">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com">
        </div>

        <div class="form-group">
            <label for="treina">Treina?</label>
            <select id="treina" name="treina">
                <option value="Não" selected>Não</option>
                <option value="Sim">Sim</option>
            </select>
        </div>

        <div class="form-group">
            <label for="observacoes">Observações</label>
            <textarea id="observacoes" name="observacoes" placeholder="Informações adicionais..." rows="3" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">CADASTRAR</button>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">Voltar</a>
</div>
{% endblock %}
