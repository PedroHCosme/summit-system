{% extends "base.html" %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center;">Novo Cadastro</h2>

    <form method="POST" action="{{ url_for('register') }}">

        <!-- Card: Dados Pessoais -->
        <div class="card">
            <div class="card-title">Dados Pessoais</div>

            <div class="form-group">
                <label for="nome">Nome *</label>
                <input type="text" id="nome" name="nome" required placeholder="Primeiro nome">
            </div>

            <div class="form-group">
                <label for="sobrenome">Sobrenome *</label>
                <input type="text" id="sobrenome" name="sobrenome" required placeholder="Sobrenome">
            </div>

            <div class="form-group">
                <label for="apelido">Apelido</label>
                <input type="text" id="apelido" name="apelido" placeholder="Como gosta de ser chamado">
            </div>

            <div class="form-group">
                <label for="data_nascimento">Data de Nascimento</label>
                <input type="date" id="data_nascimento" name="data_nascimento">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="genero">Genero</label>
                <select id="genero" name="genero">
                    <option value="" disabled selected>Selecione...</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
        </div>

        <!-- Card: Plano Desejado (Opcional) -->
        <div class="card">
            <div class="card-title">Plano Desejado</div>
            <p class="card-hint">Selecione o plano de seu interesse. A equipe confirmara na aprovacao do cadastro.</p>

            <div class="plan-selector">
                {% for plano in planos %}
                <div class="plan-option">
                    <input type="radio" id="plano_{{ loop.index }}" name="plano" value="{{ plano }}">
                    <label for="plano_{{ loop.index }}">{{ plano }}</label>
                </div>
                {% endfor %}
            </div>
        </div>

        <!-- Card: Contato -->
        <div class="card">
            <div class="card-title">Contato</div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp *</label>
                <input type="tel" id="whatsapp" name="whatsapp" required placeholder="(XX) XXXXX-XXXX">
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
            </div>
        </div>

        <!-- Card: Informacoes Adicionais -->
        <div class="card">
            <div class="card-title">Informacoes Adicionais</div>

            <div class="form-group">
                <label for="calcado">Tamanho do Calçado *</label>
                <input type="number" id="calcado" name="calcado" required placeholder="Ex: 40" min="28" max="50">
            </div>

            <div class="form-group">
                <label for="treina">Treina?</label>
                <select id="treina" name="treina">
                    <option value="Não" selected>Nao</option>
                    <option value="Sim">Sim</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
                <label for="observacoes">Observacoes</label>
                <textarea id="observacoes" name="observacoes" placeholder="Informacoes adicionais..."
                    rows="3"></textarea>
            </div>
        </div>

        <button type="submit" class="btn btn-primary">CADASTRAR</button>
    </form>

    <a href="{{ url_for('index') }}" class="back-link">Voltar</a>
</div>

<script>
    // Set max date for birth date (yesterday)
    (function() {
        const dateInput = document.getElementById('data_nascimento');
        if (dateInput) {
            const today = new Date();
            today.setDate(today.getDate() - 1);
            const maxDate = today.toISOString().split('T')[0];
            dateInput.setAttribute('max', maxDate);
        }
    })();

    // Form validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const nome = document.getElementById('nome').value.trim();
        const sobrenome = document.getElementById('sobrenome').value.trim();
        const dataNasc = document.getElementById('data_nascimento').value;
        
        if (!nome) {
            e.preventDefault();
            alert('Por favor, informe o nome.');
            return;
        }
        
        if (!sobrenome) {
            e.preventDefault();
            alert('Por favor, informe o sobrenome.');
            return;
        }
        
        if (dataNasc) {
            const today = new Date().toISOString().split('T')[0];
            if (dataNasc >= today) {
                e.preventDefault();
                alert('A data de nascimento não pode ser a data de hoje ou uma data futura.');
                return;
            }
        }

        const whatsapp = document.getElementById('whatsapp').value.trim();
        if (!whatsapp) {
            e.preventDefault();
            alert('Por favor, informe o WhatsApp.');
            document.getElementById('whatsapp').focus();
            return;
        }

        const calcado = document.getElementById('calcado').value.trim();
        if (!calcado) {
            e.preventDefault();
            alert('Por favor, informe o tamanho do calçado.');
            document.getElementById('calcado').focus();
            return;
        }
    });

    // Highlight plan option on selection
    document.querySelectorAll('.plan-option input[type="radio"]').forEach(radio => {
        radio.addEventListener('change', function () {
            document.querySelectorAll('.plan-option label').forEach(label => {
                label.style.transform = 'scale(1)';
            });
            if (this.checked) {
                this.nextElementSibling.style.transform = 'scale(1.02)';
            }
        });
    });
</script>
{% endblock %}
